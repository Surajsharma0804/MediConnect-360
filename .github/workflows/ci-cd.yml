name: CI/CD Pipeline - MediConnect 360

on:
  push:
    branches: [ main, develop, 'audit/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  POSTGRES_VERSION: '16'

jobs:
  # Security and Dependency Scanning
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Run npm audit (Frontend)
        run: npm audit --audit-level=moderate

      - name: Run npm audit (Backend)
        run: cd backend && npm audit --audit-level=moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            snyk-report.json
            npm-audit-*.json

  # Code Quality and Linting
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Run ESLint (Frontend)
        run: npm run lint

      - name: Run ESLint (Backend)
        run: cd backend && npm run lint

      - name: Run TypeScript type check (Frontend)
        run: npm run type-check

      - name: Run TypeScript type check (Backend)
        run: cd backend && npm run build

      - name: Run Prettier check
        run: |
          npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"
          cd backend && npx prettier --check "src/**/*.{ts,js,json}"

  # Unit and Integration Tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mediconnect_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Run frontend tests
        run: npm run test:ci
        env:
          CI: true

      - name: Run backend tests
        run: cd backend && npm run test:cov
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mediconnect_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info,./backend/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            backend/coverage/
            test-results.xml

  # End-to-End Tests
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mediconnect_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build frontend
        run: npm run build

      - name: Start backend server
        run: |
          cd backend && npm run start:prod &
          sleep 10
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mediconnect_e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key

      - name: Start frontend server
        run: |
          npm run preview &
          sleep 5

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/

  # Performance and Accessibility Audit
  lighthouse-audit:
    name: Lighthouse Performance & Accessibility Audit
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview &
          sleep 10

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouse.config.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Run axe accessibility tests
        run: |
          npx axe-core/cli http://localhost:4173 \
            --save ./audit/phase-1/axe-report.json \
            --reporter json

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: |
            .lighthouseci/
            audit/phase-1/axe-report.json

  # Docker Build and Security Scan
  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -t mediconnect-frontend:latest .
          docker build -t mediconnect-backend:latest ./backend

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mediconnect-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mediconnect-backend:latest'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'

      - name: Upload Docker scan results
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-results
          path: |
            trivy-*-results.sarif

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, e2e-tests, lighthouse-audit, docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/
          # Example: docker-compose -f docker-compose.staging.yml up -d

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add smoke test commands here

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/
          # Example: docker-compose -f docker-compose.prod.yml up -d

      - name: Run production smoke tests
        run: |
          echo "Running smoke tests on production..."
          # Add production smoke test commands here

      - name: Notify production deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Generate Audit Report
  audit-report:
    name: Generate Audit Report
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, e2e-tests, lighthouse-audit, docker-build]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate comprehensive audit report
        run: |
          mkdir -p audit/phase-1/ci-results
          
          # Combine all results into comprehensive report
          echo "# CI/CD Audit Report - $(date)" > audit/phase-1/ci-results/summary.md
          echo "" >> audit/phase-1/ci-results/summary.md
          
          # Security scan results
          if [ -f security-scan-results/snyk-report.json ]; then
            echo "## Security Scan: COMPLETED ✅" >> audit/phase-1/ci-results/summary.md
          else
            echo "## Security Scan: FAILED ❌" >> audit/phase-1/ci-results/summary.md
          fi
          
          # Test results
          if [ -f test-results/coverage ]; then
            echo "## Tests: PASSED ✅" >> audit/phase-1/ci-results/summary.md
          else
            echo "## Tests: FAILED ❌" >> audit/phase-1/ci-results/summary.md
          fi
          
          # Lighthouse results
          if [ -f lighthouse-results/.lighthouseci ]; then
            echo "## Performance Audit: COMPLETED ✅" >> audit/phase-1/ci-results/summary.md
          else
            echo "## Performance Audit: FAILED ❌" >> audit/phase-1/ci-results/summary.md
          fi

      - name: Upload final audit report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-audit-report
          path: audit/phase-1/