name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run backend tests
        run: cd backend && npm ci && npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service == 'backend' && './backend' || '.' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-blue-green:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      
      - name: Deploy to Blue environment
        run: |
          kubectl apply -f k8s/ -n blue
          kubectl rollout status deployment/mediconnect-backend -n blue
          kubectl rollout status deployment/mediconnect-frontend -n blue
      
      - name: Run smoke tests
        run: |
          curl -f https://blue.mediconnect360.com/health || exit 1
      
      - name: Switch traffic to Blue
        run: |
          kubectl patch service mediconnect-frontend -n production -p '{"spec":{"selector":{"version":"blue"}}}'
      
      - name: Monitor for 5 minutes
        run: sleep 300
      
      - name: Cleanup Green environment
        run: |
          kubectl delete deployment mediconnect-backend -n green
          kubectl delete deployment mediconnect-frontend -n green

  deploy-canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy Canary (10%)
        run: |
          kubectl apply -f k8s/canary.yaml
          kubectl scale deployment mediconnect-backend-canary --replicas=1
      
      - name: Monitor metrics
        run: |
          # Monitor error rates, latency for 10 minutes
          sleep 600
      
      - name: Promote to 50%
        run: kubectl scale deployment mediconnect-backend-canary --replicas=5
      
      - name: Monitor metrics
        run: sleep 600
      
      - name: Full rollout
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl delete -f k8s/canary.yaml
