version: '3.8'

# MediConnect 360 - Development Infrastructure
# This sets up all required services for local development
# Total cost: $0 (everything runs locally)

services:
  # PostgreSQL - Primary Database
  # Stores: users, appointments, prescriptions, etc.
  postgres:
    image: postgres:16-alpine
    container_name: mediconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mediconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediconnect-network

  # Redis - Cache & Session Store
  # Used for: sessions, rate limiting, real-time data
  redis:
    image: redis:7-alpine
    container_name: mediconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediconnect-network

  # MinIO - S3-Compatible Object Storage (FREE!)
  # Stores: medical documents, images, prescriptions
  # Access console at: http://localhost:9001
  # Credentials: minioadmin / minioadmin
  minio:
    image: minio/minio:latest
    container_name: mediconnect-minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # API endpoint
      - "9001:9001"      # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mediconnect-network

  # MinIO Client - Auto-create buckets
  # Creates the 'mediconnect-files' bucket on startup
  minio-client:
    image: minio/mc:latest
    container_name: mediconnect-minio-client
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/mediconnect-files --ignore-existing;
      /usr/bin/mc anonymous set public myminio/mediconnect-files;
      exit 0;
      "
    networks:
      - mediconnect-network

  # MongoDB - Document Database (OPTIONAL - Currently not used)
  # Uncomment if you need document storage for EHR records, medical history, chat messages
  # mongodb:
  #   image: mongo:7
  #   container_name: mediconnect-mongo
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: password
  #     MONGO_INITDB_DATABASE: mediconnect
  #   volumes:
  #     - mongodb_data:/data/db
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - mediconnect-network

  # pgAdmin - PostgreSQL Web Interface (Optional)
  # Access at: http://localhost:5050
  # Email: admin@mediconnect.com / Password: admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mediconnect-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mediconnect.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - mediconnect-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

  # Mongo Express - MongoDB Web Interface (Optional - Disabled)
  # Uncomment if you enable MongoDB above
  # Access at: http://localhost:8081
  # mongo-express:
  #   image: mongo-express:latest
  #   container_name: mediconnect-mongo-express
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: admin
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: password
  #     ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
  #     ME_CONFIG_BASICAUTH_USERNAME: admin
  #     ME_CONFIG_BASICAUTH_PASSWORD: admin
  #   depends_on:
  #     - mongodb
  #   networks:
  #     - mediconnect-network
  #   profiles:
  #     - tools  # Only start with: docker-compose --profile tools up

  # Redis Commander - Redis Web Interface (Optional)
  # Access at: http://localhost:8082
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mediconnect-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - mediconnect-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

# Persistent volumes for data storage
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  # mongodb_data:  # Uncomment if you enable MongoDB
  #   driver: local
  pgadmin_data:
    driver: local

# Network for service communication
networks:
  mediconnect-network:
    driver: bridge

# ======================
# USAGE INSTRUCTIONS
# ======================

# Start all core services:
#   docker-compose up -d

# Start with management tools (pgAdmin, Mongo Express, Redis Commander):
#   docker-compose --profile tools up -d

# View logs:
#   docker-compose logs -f
#   docker-compose logs -f postgres  # Specific service

# Check status:
#   docker-compose ps

# Stop all services:
#   docker-compose down

# Stop and remove all data (⚠️ WARNING: Deletes all data):
#   docker-compose down -v

# Restart a specific service:
#   docker-compose restart postgres

# ======================
# ACCESS INFORMATION
# ======================

# PostgreSQL:
#   Host: localhost
#   Port: 5432
#   User: postgres
#   Password: password
#   Database: mediconnect
#   Connection String: postgresql://postgres:password@localhost:5432/mediconnect

# Redis:
#   Host: localhost
#   Port: 6379
#   Connection String: redis://localhost:6379

# MinIO (S3):
#   API Endpoint: http://localhost:9000
#   Console: http://localhost:9001
#   Access Key: minioadmin
#   Secret Key: minioadmin
#   Bucket: mediconnect-files

# MongoDB:
#   Host: localhost
#   Port: 27017
#   User: admin
#   Password: password
#   Database: mediconnect
#   Connection String: mongodb://admin:password@localhost:27017/mediconnect

# Management Tools (with --profile tools):
#   pgAdmin: http://localhost:5050 (admin@mediconnect.com / admin)
#   Mongo Express: http://localhost:8081 (admin / admin)
#   Redis Commander: http://localhost:8082

# ======================
# TROUBLESHOOTING
# ======================

# Port already in use:
#   - Change the port mapping in this file
#   - Example: "5433:5432" instead of "5432:5432"

# Service won't start:
#   - Check logs: docker-compose logs <service-name>
#   - Restart: docker-compose restart <service-name>

# Out of disk space:
#   - Clean up: docker system prune -a --volumes
#   - Warning: This removes ALL Docker data

# Permission issues:
#   - Linux: sudo chown -R $USER:$USER ./volumes
#   - Or run: docker-compose down -v && docker-compose up -d

# ======================
# PRODUCTION NOTES
# ======================

# ⚠️ DO NOT use this setup in production!
# 
# For production:
# 1. Use managed services (AWS RDS, ElastiCache, etc.)
# 2. Change all default passwords
# 3. Enable SSL/TLS
# 4. Set up proper backups
# 5. Configure monitoring
# 6. Use secrets management
# 7. Enable authentication on all services
# 8. Set up proper networking/firewalls

# ======================
# BACKUP & RESTORE
# ======================

# Backup PostgreSQL:
#   docker exec mediconnect-db pg_dump -U postgres mediconnect > backup.sql

# Restore PostgreSQL:
#   docker exec -i mediconnect-db psql -U postgres mediconnect < backup.sql

# Backup MongoDB:
#   docker exec mediconnect-mongo mongodump --out /backup

# Backup MinIO:
#   docker exec mediconnect-minio mc mirror myminio/mediconnect-files /backup

# ======================
# RESOURCE LIMITS
# ======================

# To limit resource usage, add to each service:
#   deploy:
#     resources:
#       limits:
#         cpus: '0.5'
#         memory: 512M
#       reservations:
#         cpus: '0.25'
#         memory: 256M
