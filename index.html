<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- SEO -->
    <title>MediConnect 360 — India's Smartest Healthcare Platform</title>
    <meta name="description" content="Compare hospitals, find doctors, manage medical records, book appointments, and access AI-powered health tools. MediConnect 360 — healthcare reimagined." />
