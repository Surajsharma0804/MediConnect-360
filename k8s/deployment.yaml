apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediconnect-backend
  labels:
    app: mediconnect
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mediconnect
      tier: backend
  template:
    metadata:
      labels:
        app: mediconnect
        tier: backend
    spec:
      containers:
      - name: backend
        image: mediconnect/backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mediconnect-secrets
              key: database-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediconnect-frontend
  labels:
    app: mediconnect
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediconnect
      tier: frontend
  template:
    metadata:
      labels:
        app: mediconnect
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: mediconnect/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
