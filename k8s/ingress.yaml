apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediconnect-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - mediconnect360.com
    - api.mediconnect360.com
    secretName: mediconnect-tls
  rules:
  - host: mediconnect360.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mediconnect-frontend
            port:
              number: 80
  - host: api.mediconnect360.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mediconnect-backend
            port:
              number: 3000
