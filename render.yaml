# Render.com Complete Deployment Configuration
services:
  # Backend API Service
  - type: web
    name: mediconnect-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Core Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      
      # Database Connections
      - key: DATABASE_URL
        fromDatabase:
          name: mediconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mediconnect-redis
          property: connectionString
      
      # Authentication Secrets (Auto-generated)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      
      # Encryption (Auto-generated)
      - key: ENCRYPTION_KEY
        generateValue: true
      
      # External API Keys (Set manually)
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      
      # Email Configuration
      - key: FROM_EMAIL
        value: noreply@mediconnect360.com
      - key: FROM_NAME
        value: MediConnect 360
      
      # CORS Configuration
      - key: CORS_ORIGIN
        value: https://medi-connect-360.vercel.app
      - key: CORS_CREDENTIALS
        value: true
      
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      # File Upload
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/gif,application/pdf
      
      # Logging
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      
      # Feature Flags
      - key: ENABLE_REGISTRATION
        value: true
      - key: ENABLE_EMAIL_VERIFICATION
        value: true
      - key: ENABLE_2FA
        value: true
      - key: ENABLE_VIDEO_RECORDING
        value: false
      - key: ENABLE_AI_DIAGNOSTICS
        value: true

databases:
  # PostgreSQL Database
  - name: mediconnect-db
    databaseName: mediconnect
    plan: free
    region: oregon
    postgresMajorVersion: 16

  # Redis Cache
  - name: mediconnect-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru